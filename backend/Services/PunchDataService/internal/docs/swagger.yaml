info:
  contact:
    name: EnterpriseERP Platform Team
  description: Collects raw punch logs from biometric devices, file uploads, manual
    entry, and read-only import from a public ZKTeco SQL Server. Stores normalised
    rows in PunchRecords with deduplication. Does not calculate attendance (see AttendanceService).
  title: PunchDataService API
  version: "1.0"
paths:
  /api/v1/punch-data/imports:
    get:
      parameters:
      - description: Filter by company id (from query or JWT)
        in: query
        name: companyId
        type: integer
      - description: Filter by batch status
        in: query
        name: status
        type: string
      - default: 1
        description: Page (1-based)
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_enterprise-erp_punchdata_internal_response.ApiResponse-github_com_enterprise-erp_punchdata_internal_response_PagedResult-github_com_enterprise-erp_punchdata_internal_models_PunchImportBatch'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_enterprise-erp_punchdata_internal_response.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_enterprise-erp_punchdata_internal_response.ApiResponse-any'
      security:
      - BearerAuth: []
      summary: List import batch history
      tags:
      - imports
  /api/v1/punch-data/imports/{id}/errors:
    get:
      parameters:
      - description: Import batch id (uuid)
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page (1-based)
        in: query
        name: page
        type: integer
      - default: 100
        description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_enterprise-erp_punchdata_internal_response.ApiResponse-github_com_enterprise-erp_punchdata_internal_response_PagedResult-github_com_enterprise-erp_punchdata_internal_models_PunchImportError'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_enterprise-erp_punchdata_internal_response.ApiResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_enterprise-erp_punchdata_internal_response.ApiResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_enterprise-erp_punchdata_internal_response.ApiResponse-any'
      security:
      - BearerAuth: []
      summary: List row errors for an import batch
      tags:
      - imports
  /api/v1/punch-data/logs:
    get:
      description: Returns a paginated slice of log payloads, newest first.
      parameters:
      - description: Filter by company id
        in: query
        name: companyId
        type: integer
      - description: Filter by device id
        in: query
        name: deviceId
        type: string
      - description: Filter by status
        enum:
        - Pending
        - Processing
        - Completed
        - Failed
        in: query
        name: status
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size (max 200)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
