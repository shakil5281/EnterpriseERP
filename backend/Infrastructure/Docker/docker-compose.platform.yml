  procurement:
    profiles:
      - gateway-docker
    build:
      context: ../..
      dockerfile: Services/ProcurementService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5060"
      ConnectionStrings__ProcurementDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=ProcurementServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      Jwt__SigningKey: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32+"
