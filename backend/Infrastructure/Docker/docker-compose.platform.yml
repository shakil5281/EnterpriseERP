    restart: unless-stopped

  cutting:
    profiles:
      - gateway-docker
    build:
      context: ../..
      dockerfile: Services/CuttingService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5044"
      ConnectionStrings__CuttingDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=CuttingServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__AuthDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=AuthServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__Redis: "redis:6379"
