  store:
    profiles:
      - gateway-docker
    build:
      context: ../..
      dockerfile: Services/StoreService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5042"
      ConnectionStrings__StoreDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=StoreServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__AuthDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=AuthServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      InventorySync__BaseUrl: "http://inventory:5041/"
      Jwt__SigningKey: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32+"
      Jwt__Issuer: AuthService
      Jwt__Audience: Erp.Platform
      Database__AutoMigrate: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - inventory
    networks:
      - erp
    restart: unless-stopped

  sewing:
    profiles:
      - gateway-docker
    build:
      context: ../..
      dockerfile: Services/SewingService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5130"
      ConnectionStrings__SewingDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=SewingServiceDockerDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__AuthDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=AuthServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__Redis: "redis:6379"
      Services__MerchandisingService: "http://merchandising:5288"
      Services__ImportExportService: "http://importexport:8060"
      Jwt__SigningKey: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32+"
      Jwt__Issuer: AuthService
      Jwt__Audience: Erp.Platform
      Database__UseInMemory: "false"
      Database__AutoMigrate: "true"
    extra_hosts:
