    environment:
      NOTIFICATION_DB_CONNECTION: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=NotificationServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      NOTIFICATION_PORT: "5047"
      NOTIFICATION_AUTO_MIGRATE: "true"
      JWT_SIGNING_KEY: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32+"
    extra_hosts:
      - "host.docker.internal:host-gateway"
