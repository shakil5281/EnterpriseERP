# Canonical Docker Compose definitions for EnterpriseERP (referenced from backend/docker-compose.yml).
#
# Infrastructure only:
#   docker compose up -d redis rabbitmq seq
#
# Full API gateway stack (Platform.Host + Go services + YARP gateway on :5000):
#   docker compose --profile gateway-docker up -d --build
#
# Host-only gateway (requires microservices running on the host at ports 5012–5049):
#   docker compose --profile gateway-host up -d --build gateway-host
#
# SQL Server must accept TCP from Docker. Override ERP_SQL_SERVER in .env if needed
# (default: host.docker.internal,1433 for SQL Express on Docker Desktop Windows).

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - erp

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: erp
      RABBITMQ_DEFAULT_PASS: erp_dev_password
    restart: unless-stopped
    networks:
      - erp

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    restart: unless-stopped
    networks:
      - erp

  platform-host:
    profiles:
      - gateway-docker
    build:
      context: ../..
      dockerfile: Platform.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__AuthDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=AuthServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__CompanyDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=CompanyServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__HrDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=HRServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__AttendanceDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=AttendanceServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__LeaveDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=LeaveServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__ShiftDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=ShiftServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__PayrollDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=PayrollServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__NotificationDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=NotificationServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__QualityDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=QualityServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__FinishingDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=FinishingServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__SecurityDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=SecurityServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__AccountsDb: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=AccountsServiceDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      ConnectionStrings__Redis: "redis:6379"
      ImportExport__BaseUrl: "http://importexport:8060"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: erp
      RabbitMQ__Password: erp_dev_password
      Jwt__SigningKey: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32+"
      Jwt__Issuer: AuthService
      Jwt__Audience: Erp.Platform
      PlatformHost__SkipServiceDatabaseMigrations: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - erp
    restart: unless-stopped

  punchdata:
    profiles:
      - gateway-docker
    build:
      context: ../../Services/PunchDataService
      dockerfile: Dockerfile
    environment:
      PUNCHDATA_CONNECTIONSTRING: "Server=${ERP_SQL_SERVER:-host.docker.internal,1433};Database=PunchDataDB;${ERP_SQL_AUTH:-User Id=erp_docker;Password=erp_dev_password_2026!;Encrypt=Optional;TrustServerCertificate=True;MultipleActiveResultSets=true}"
      PUNCHDATA_SERVER_ADDRESS: ":5050"
      PUNCHDATA_JWT_SIGNINGKEY: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32+"
      PUNCHDATA_SWAGGER_ONLY_ON_DB_FAILURE: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - erp
    restart: unless-stopped

  importexport:
    profiles:
      - gateway-docker
    build:
