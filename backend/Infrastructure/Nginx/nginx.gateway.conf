# Example TLS termination / reverse proxy in front of YARP Gateway.Api (port 5000).
# Adjust server_name and ssl_certificate paths for your environment.

upstream erp_gateway {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name erp.local;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://erp_gateway;
    }
}
