name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        working-directory: backend
        run: docker compose -f docker-compose.yml --profile gateway-docker config

      - name: Build Docker images
        working-directory: backend
        run: docker compose -f docker-compose.yml --profile gateway-docker build --pull
